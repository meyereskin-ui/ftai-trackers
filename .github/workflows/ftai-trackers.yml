name: FTAI trackers
on:
  schedule:
    - cron: "17 11 * * *"   # daily 11:17 UTC (7:17am Eastern); FAA posts the file overnight
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run trackers
        env:
          FTAI_UA: ${{ secrets.FTAI_UA }}          # "Your Name you@example.com"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}      # optional email alerts
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python faa_tracker.py run || echo "::warning::FAA download failed"
          python edgar_tracker.py run --days 7
      - name: Save snapshot database and alert log
        run: |
          git config user.name "ftai-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ftai.db data/alerts.md
          git diff --cached --quiet || git commit -m "tracker run $(date -u +%F)"
          git push
